# Generated by matrix-rice (Matrix {{NAME}}). Switch with: matrix-rice green|cyan|amber
"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
format = '''
[┌──\[](fg:{{DIM}})$username[@](fg:{{DIM}})$hostname[\]──\[](fg:{{DIM}})$directory[\]](fg:{{DIM}})$git_branch$git_status$python$cmd_duration
[└─](fg:{{DIM}})$character'''

[username]
show_always = true
style_user = "bold fg:{{FG}}"
style_root = "bold fg:{{ALERT}}"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold fg:{{FG}}"
format = "[$hostname]($style)"

[directory]
style = "fg:{{HEAD}}"
read_only = " ro"
read_only_style = "fg:{{ALERT}}"
truncation_length = 4
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = "git:"
style = "fg:{{FG}}"
format = '[──\[](fg:{{DIM}})[$symbol$branch]($style)'

[git_status]
style = "fg:{{C3}}"
format = '([ $all_status$ahead_behind]($style))[\]](fg:{{DIM}})'

[python]
symbol = "py:"
style = "fg:{{DIM}}"
format = '[ \($symbol$virtualenv\)]($style)'
detect_extensions = []
detect_files = []

[cmd_duration]
min_time = 2000
style = "fg:{{DIM}}"
format = "[ took $duration]($style)"

[character]
success_symbol = "[>](bold fg:{{FG}})"
error_symbol = "[x](bold fg:{{ALERT}})"
