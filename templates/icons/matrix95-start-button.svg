<?xml version="1.0" encoding="UTF-8"?>
<!-- Matrix 95 Start button ({{NAME}}): bevel + logo + label in one wide image.
     Kickoff shows non-square images at full width when menuLabel is empty. -->
<svg xmlns="http://www.w3.org/2000/svg" width="72" height="26" viewBox="0 0 72 26" shape-rendering="crispEdges">
  <rect x="0" y="0" width="72" height="26" fill="{{DKSHADOW}}"/>
  <rect x="0" y="0" width="71" height="25" fill="{{HILITE}}"/>
  <rect x="1" y="1" width="70" height="24" fill="{{SHADOW}}"/>
  <rect x="1" y="1" width="69" height="23" fill="{{LIGHT}}"/>
  <rect x="2" y="2" width="68" height="22" fill="{{FACE}}"/>
  <g transform="translate(4,4) scale(0.75)">
    <rect x="11" y="3" width="3" height="1" fill="{{FG}}"/>
    <rect x="16" y="3" width="2" height="1" fill="{{HEAD}}"/>
    <rect x="8" y="4" width="6" height="1" fill="{{FG}}"/>
    <rect x="16" y="4" width="5" height="1" fill="{{HEAD}}"/>
    <rect x="2" y="5" width="3" height="2" fill="{{FG}}"/>
    <rect x="6" y="5" width="8" height="6" fill="{{FG}}"/>
    <rect x="16" y="5" width="8" height="6" fill="{{HEAD}}"/>
    <rect x="0" y="9" width="5" height="2" fill="{{DIM}}"/>
    <rect x="6" y="11" width="5" height="1" fill="{{FG}}"/>
    <rect x="18" y="11" width="6" height="1" fill="{{HEAD}}"/>
    <rect x="6" y="12" width="2" height="1" fill="{{FG}}"/>
    <rect x="21" y="12" width="3" height="1" fill="{{HEAD}}"/>
    <rect x="1" y="13" width="4" height="2" fill="{{HILITE}}"/>
    <rect x="11" y="13" width="3" height="1" fill="{{DIM}}"/>
    <rect x="16" y="13" width="2" height="1" fill="{{HILITE}}"/>
    <rect x="8" y="14" width="6" height="1" fill="{{DIM}}"/>
    <rect x="16" y="14" width="5" height="1" fill="{{HILITE}}"/>
    <rect x="6" y="15" width="8" height="6" fill="{{DIM}}"/>
    <rect x="16" y="15" width="8" height="6" fill="{{HILITE}}"/>
    <rect x="0" y="17" width="5" height="2" fill="{{DIM}}"/>
    <rect x="2" y="21" width="3" height="1" fill="{{FG}}"/>
    <rect x="6" y="21" width="5" height="1" fill="{{DIM}}"/>
    <rect x="18" y="21" width="6" height="1" fill="{{HILITE}}"/>
    <rect x="6" y="22" width="2" height="1" fill="{{DIM}}"/>
    <rect x="21" y="22" width="3" height="1" fill="{{HILITE}}"/>
  </g>
  <text x="25" y="18" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold" fill="{{HEAD}}">Start</text>
</svg>
