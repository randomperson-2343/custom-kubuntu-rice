<!-- Matrix 95 {{NAME}}: open-popup marker in the system tray (widgets/tabbar). Generated by templates/plasma-theme/tools/gen-svgs.py; colors come from palettes/{{ID}}.sh. Pixel art: do not add gradients, blur or non-integer coordinates. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="23" viewBox="0 0 24 23" shape-rendering="crispEdges">
