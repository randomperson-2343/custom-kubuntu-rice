<g id="active-tab-center"><rect x="5" y="2" width="1" height="1" fill="{{LIGHT}}"/><rect x="2" y="2" width="1" height="1" fill="{{FACE}}"/><rect x="4" y="2" width="1" height="1" fill="{{FACE}}"/><rect x="3" y="2" width="1" height="1" fill="{{LIGHT}}"/><rect x="3" y="3" width="1" height="1" fill="{{FACE}}"/><rect x="5" y="3" width="1" height="1" fill="{{FACE}}"/><rect x="2" y="3" width="1" height="1" fill="{{LIGHT}}"/><rect x="4" y="3" width="1" height="1" fill="{{LIGHT}}"/><rect x="5" y="4" width="1" height="1" fill="{{LIGHT}}"/><rect x="2" y="4" width="1" height="1" fill="{{FACE}}"/><rect x="4" y="4" width="1" height="1" fill="{{FACE}}"/><rect x="3" y="4" width="1" height="1" fill="{{LIGHT}}"/><rect x="3" y="5" width="1" height="1" fill="{{FACE}}"/><rect x="5" y="5" width="1" height="1" fill="{{FACE}}"/><rect x="2" y="5" width="1" height="1" fill="{{LIGHT}}"/><rect x="4" y="5" width="1" height="1" fill="{{LIGHT}}"/></g>
<g id="active-tab-right"><rect x="6" y="2" width="1" height="4" fill="{{LIGHT}}"/><rect x="7" y="2" width="1" height="4" fill="{{HILITE}}"/></g>
